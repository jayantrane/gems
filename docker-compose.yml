name: ${COMPOSE_PROJECT_NAME:-gems}

services:
  frontend:
    image: python:3.12-slim
    working_dir: /app
    command: python -m http.server 8888 --bind 0.0.0.0
    volumes:
      - ${PROJECTS_DIR}/gems:/app
    ports:
      - "${FRONTEND_PORT:-8888}:8888"
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    working_dir: /app/admin
    command: python app.py
    volumes:
      - ${PROJECTS_DIR}/gems:/app
    ports:
      - "${ADMIN_PORT:-5050}:5050"
    restart: unless-stopped
    depends_on:
      - frontend
